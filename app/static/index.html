<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>农商行知识问答</title>
<style>body{max-width:760px;margin:3rem auto;font:16px system-ui;color:#172033}textarea{width:100%;height:100px;padding:12px}button{margin-top:12px;padding:9px 18px;background:#005bac;color:white;border:0;border-radius:4px}pre{white-space:pre-wrap;line-height:1.7;background:#f5f7fa;padding:16px}</style>
<h1>农商行知识问答</h1><textarea id="q" placeholder="请输入业务问题"></textarea><br><button onclick="ask()">提问</button><pre id="a"></pre>
<script>async function ask(){const q=document.querySelector('#q').value,a=document.querySelector('#a');a.textContent='';const r=await fetch('/api/kb/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:q}],ranges:[{knowledge_base_id:'37c5dwtg4ufbw332',doc_range:[]}]})});const rd=r.body.getReader(),d=new TextDecoder();let b='';for(;;){const x=await rd.read();if(x.done)break;b+=d.decode(x.value,{stream:true});const e=b.split('\n\n');b=e.pop();for(const v of e){if(!v.startsWith('event: token'))continue;const line=v.split('\n').find(x=>x.startsWith('data: '));if(line){const j=JSON.parse(line.slice(6));a.textContent+=j.content}}}}</script>
</html>
